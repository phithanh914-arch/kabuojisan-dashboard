<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-1200: #032213;
      --primary-900: #115A36;
      --primary-600: #259D63;
      --primary-400: #51B883;
      --primary-200: #9BD4B5;
      --primary-50: #E6F5EC;
      --bg: #F8F8FB;
      --bg-white: #FFFFFF;
      --text: #1A1A1A;
      --label: #626264;
      --text-weak: #999999;
      --border: #E0E0E0;
      --red-600: #FE3939;
      --red-50: #FDEEEE;
      --orange-600: #FB5B01;
      --orange-50: #FFF3EB;
      --blue-600: #2B7DE1;
      --blue-50: #EBF3FD;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-900);
      letter-spacing: -0.02em;
    }
    .regime-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .regime-badge.risk-on { background: var(--primary-50); color: var(--primary-900); }
    .regime-badge.risk-off { background: var(--red-50); color: var(--red-600); }
    .regime-badge.neutral { background: var(--orange-50); color: var(--orange-600); }
    .regime-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    .regime-badge.risk-on .dot { background: var(--primary-600); }
    .regime-badge.risk-off .dot { background: var(--red-600); }
    .regime-badge.neutral .dot { background: var(--orange-600); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      color: var(--label);
    }
    .header-meta .val { font-weight: 600; color: var(--text); }

    /* ─── KPI Cards ─── */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      padding: 20px 32px;
    }
    .kpi-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
      transition: box-shadow 0.2s;
    }
    .kpi-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .kpi-card .kpi-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }
    .kpi-card .kpi-label {
      font-size: 11px;
      color: var(--label);
      margin-top: 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .kpi-card.highlight { border-color: var(--primary-400); background: var(--primary-50); }
    .kpi-card.highlight .kpi-value { color: var(--primary-900); }
    .kpi-card.warn { border-color: var(--red-600); background: var(--red-50); }
    .kpi-card.warn .kpi-value { color: var(--red-600); }

    /* ─── Pipeline ─── */
    .pipeline-section {
      padding: 0 32px 16px;
    }
    .pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      overflow-x: auto;
    }
    .pipeline-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
      flex: 1;
    }
    .pipeline-stage .stage-count {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-900);
    }
    .pipeline-stage .stage-label {
      font-size: 10px;
      color: var(--label);
      font-weight: 500;
      white-space: nowrap;
    }
    .pipeline-arrow {
      color: var(--text-weak);
      font-size: 16px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    /* ─── Tabs ─── */
    .tabs-wrapper { padding: 0 32px; }
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
    }
    .tab-btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--label);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }
    .tab-btn:hover { color: var(--primary-900); }
    .tab-btn.active {
      color: var(--primary-900);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0; right: 0;
      height: 2px;
      background: var(--primary-600);
    }

    /* ─── Main layout ─── */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 32px 32px;
      min-height: 500px;
    }
    @media (max-width: 1100px) {
      .main-content { grid-template-columns: 1fr; }
    }

    /* ─── Table Panel ─── */
    .panel {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-900);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header .badge {
      font-size: 11px;
      background: var(--primary-50);
      color: var(--primary-900);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--label);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
    }
    tbody td {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--primary-50); }
    tbody tr.selected { background: var(--primary-50); border-left: 3px solid var(--primary-600); }

    .code-cell {
      font-weight: 600;
      color: var(--primary-900);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tv-link {
      color: var(--text-weak);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.15s;
    }
    .tv-link:hover { color: var(--primary-600); }

    .stage-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .stage-tag.band-reclaim { background: var(--primary-50); color: var(--primary-900); }
    .stage-tag.polygraph-early { background: var(--blue-50); color: var(--blue-600); }
    .stage-tag.accumulation-watch { background: #F5F5F5; color: var(--label); }

    .signal-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .signal-tag.stop-loss { background: var(--red-50); color: var(--red-600); }
    .signal-tag.hold { background: var(--primary-50); color: var(--primary-900); }
    .signal-tag.consider-exit { background: var(--orange-50); color: var(--orange-600); }

    .return-val.positive { color: var(--primary-600); font-weight: 600; }
    .return-val.negative { color: var(--red-600); font-weight: 600; }

    /* ─── Chart Panel ─── */
    .chart-panel {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }
    .chart-panel .panel-header {
      flex-shrink: 0;
    }
    #tv-chart-container {
      flex: 1;
      min-height: 440px;
    }
    #tv-chart-container.empty {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tv-chart-container .placeholder {
      text-align: center;
      color: var(--text-weak);
      font-size: 14px;
    }
    #tv-chart-container .placeholder .icon { font-size: 40px; margin-bottom: 8px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .table-scroll { max-height: 460px; overflow-y: auto; }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--label);
      font-size: 14px;
    }
  
/* Responsive Styles */
@media (max-width: 768px) {
  .dashboard-body {
    padding: 10px 12px;
  }
  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 12px 16px;
  }
  .header-title {
    font-size: 16px;
    white-space: nowrap;
  }
  .header-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
  }
  .kpi-grid {
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 6px !important;
  }
  .separator { display: none; } /* Hide the right arrow in pipeline on mobile */
  .pipeline-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .pipeline-flow {
    min-width: 500px;
  }
  .tab-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    display: flex;
    white-space: nowrap;
  }
  .tab-btn {
    padding: 6px 14px;
    font-size: 12px;
    flex-shrink: 0;
  }
  .main-content {
    flex-direction: column;
  }
  .table-panel { width: 100%; }
  .chart-panel { 
    width: 100%; 
    position: sticky;
    bottom: 0;
    margin-bottom: -10px; /* pull down to edge */
    background: #FFFFFF;
    border-top: 1px solid #E0E0E0;
    z-index: 10;
  }
  .chart-panel iframe {
    height: 300px !important;
  }
  
  /* Tables to Cards */
  .table-scroll { overflow-x: hidden; }
  table, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tr {
    padding: 10px 0;
    border-bottom: 1px solid #E0E0E0;
    cursor: pointer;
  }
  tr:last-child {
    border-bottom: none;
  }
  td {
    padding: 0 !important;
    border: none !important;
    text-align: left !important;
  }
  td:nth-child(1), td:nth-child(2) {
    display: inline-block;
    width: auto;
    font-size: 13px;
    font-weight: 700;
  }
  td:nth-child(2) {
    margin-left: 8px;
    margin-bottom: 6px;
  }
  td:not(:nth-child(1)):not(:nth-child(2)) {
    display: inline-block;
    width: auto;
    font-size: 11px;
    color: #626264;
    margin-right: 6px;
    margin-bottom: 4px;
    background: #F0F0F0;
    padding: 2px 6px !important;
    border-radius: 4px;
  }
}

    async function loadData() {
      if (INLINE_DATA) {
        D = INLINE_DATA;
        render();
        return;
      }
      try {
        const resp = await fetch('./dashboard_data.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        D = await resp.json();
        console.log('Dashboard data loaded:', D);
        render();
      } catch (err) {
        console.error('Failed to load dashboard data:', err);
        document.querySelector('.main-content').innerHTML = 
          '<div style="padding:40px; text-align:center; color:#FE3939; width:100%;">'
          + '<p style="font-size:16px; font-weight:700;">データ読み込みエラー</p>'
          + '<p style="font-size:12px; color:#626264;">dashboard_data.json が見つかりません</p>'
          + '<p style="font-size:11px; color:#999;">' + err.message + '</p>'
          + '</div>';
      }
    }

    // ─── Render ───
    function render() {
      if (!D) { console.error('data is null'); return; }

      const counts = D.counts || {};
      const regime = D.regime || {};
      D.counts = counts;
      D.regime = regime;
      D.near_miss_a = D.near_miss_a || [];
      D.near_miss_b = D.near_miss_b || [];
      D.buy_collect = D.buy_collect || [];
      D.early_stage1 = D.early_stage1 || [];
      D.early_non_stage1 = D.early_non_stage1 || [];
      D.portfolio = D.portfolio || [];


      // Header
      const rg = D.regime;
      const badge = document.getElementById('regime-badge');
      const cls = rg.status === 'RISK_ON' ? 'risk-on' : rg.status === 'RISK_OFF' ? 'risk-off' : 'neutral';
      badge.className = `regime-badge ${cls}`;
      document.getElementById('regime-text').textContent = (rg.status || "").replace('_', ' ');
      document.getElementById('hdr-vix').textContent = (rg.vix || "—");
      document.getElementById('hdr-ad').textContent = (rg.ad_ratio_5d || "—");
      document.getElementById('hdr-cash').textContent = (rg.cash_ratio || 0) + '%';
      document.getElementById('hdr-date').textContent = formatDate(D.date || "") + ' ' + (D.updated_at || " ").split(' ')[1] || "";

      // KPI
      const c = D.counts;
      const kpis = [
        { label: 'S級', value: c.s, cls: c.s > 0 ? 'highlight' : '' },
        { label: 'A級', value: c.a, cls: c.a > 0 ? 'highlight' : '' },
        { label: 'SUPER SETUP', value: c.super_setup },
        { label: 'SET UP', value: c.setup },
        { label: '買い集め', value: c.accumulation, cls: 'highlight' },
        { label: '初動', value: c.early_break, cls: c.early_break > 0 ? 'highlight' : '' },
        { label: '初動(S1)', value: c.early_stage1 },
        { label: '初動(非S1)', value: c.early_non_stage1 },
      ];
      document.getElementById('kpi-strip').innerHTML = kpis.map(k =>
        `<div class="kpi-card ${k.cls || ''}">
           <div class="kpi-value">${k.value}</div>
           <div class="kpi-label">${k.label}</div>
         </div>`
      ).join('');

      // Pipeline
      const stages = [
        { label: 'Quiet', count: c.quiet },
        { label: 'Active', count: c.active },
        { label: '買い集め', count: c.accumulation },
        { label: '初動', count: c.early_break },
        { label: 'SET UP', count: c.setup },
        { label: 'S.SETUP', count: c.super_setup },
        { label: 'S級', count: c.s },
      ];
      document.getElementById('pipeline').innerHTML = stages.map((s, i) =>
        (i > 0 ? '<div class="pipeline-arrow">→</div>' : '') +
        `<div class="pipeline-stage">
           <div class="stage-count">${s.count}</div>
           <div class="stage-label">${s.label}</div>
         </div>`
      ).join('');

      // Tables
      renderNearMissA();
      renderNearMissB();
      renderAccumulation();
      renderEarlyS1();
      renderEarlyNS1();
      renderPortfolio();
    }

    // ─── Table Renderers ───

    // ─── TradingView Chart ───
    let currentCode = null;

    function showChart(code) {
      currentCode = code;

      // Highlight selected row
      document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected'));
      document.querySelectorAll(`tbody tr[data-code="${code}"]`).forEach(tr => tr.classList.add('selected'));

      const container = document.getElementById('tv-chart-container');
      container.classList.remove('empty');
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:14px; font-weight:700; color:#032213;">チャート — ${code}</span>
          <a href="https://www.tradingview.com/chart/?symbol=TSE:${code}" 
             target="_blank" 
             style="font-size:12px; color:#259D63; text-decoration:none;">
            TradingViewで開く ↗
          </a>
        </div>
        <iframe 
          src="https://s.tradingview.com/widgetembed/?hideideas=1&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=ja&symbol=TSE:${code}&interval=D&theme=light&style=1&timezone=Asia%2FTokyo&studies=%5B%5D&withdateranges=1&hide_side_toolbar=0&allow_symbol_change=1&save_image=0&hidevolume=0"
          style="width:100%; height:450px; border:1px solid #E0E0E0; border-radius:4px;"
          frameborder="0"
          allowfullscreen>
        </iframe>
      `;
    }

    // ─── Tabs ───
    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.tab;
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.getElementById('pane-' + target).classList.add('active');
    });

    // ─── Utility ───
    function formatDate(d) {
      if (!d || d.length !== 8) return d;
      return `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;
    }
